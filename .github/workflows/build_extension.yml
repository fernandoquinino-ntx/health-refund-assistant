name: Validar extensão Chrome

on:
  push:
    paths:
      - "src/extension/**"
      - "src/treinamento_visual/scripts/build_extension.sh"
      - ".github/workflows/build_extension.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON e montar pacote
        run: bash src/treinamento_visual/scripts/build_extension.sh
      - name: Publicar pacote da extensão
        uses: actions/upload-artifact@v4
        with:
          name: care_plus_extension
          path: build/extension
