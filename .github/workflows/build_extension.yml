name: Validar extensão Chrome

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "src/extension/**"
      - "src/toolbox/operacoes.py"
      - ".github/workflows/build_extension.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON e montar pacote
        run: PYTHONPATH=src python -m toolbox build_extension
      - name: Publicar pacote da extensão
        uses: actions/upload-artifact@v4
        with:
          name: care_plus_extension
          path: |
            build/extension
            build/care-plus-reembolsos-*.zip
            build/care-plus-reembolsos-*.sha256
      - name: Anexar ZIP à release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=$(ls build/care-plus-reembolsos-*.zip)
          checksum=$(ls build/care-plus-reembolsos-*.sha256)
          gh release upload "${GITHUB_REF_NAME}" "$package" "$checksum" --clobber
