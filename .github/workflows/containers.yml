name: Validar containers locais

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON do devcontainer
        run: python -m json.tool .devcontainer/devcontainer.json >/dev/null
      - name: Instalar aplicação
        run: python -m pip install -e .
      - name: Executar aplicação em modo headless
        run: |
          PYTHONPATH=src python -m streamlit run app.py \
            --server.address 127.0.0.1 --server.port 8501 --server.headless true \
            >/tmp/health-refund.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/health-refund.log
          exit 1
