[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-refund-assistant"
version = "0.4.1"
description = "Assistente para extrair e acompanhar solicitações de reembolso de saúde."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21,<5",
    "openai>=1.0,<3",
    "PyMuPDF>=1.24,<2",
    "pytesseract==0.3.13",
    "streamlit>=1.40,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
training = [
    "mlx-vlm[train]==0.8.1",
    "PyMuPDF>=1.24,<2",
    "pytesseract==0.3.13",
    "pillow",
    "pandas",
    "huggingface-hub",
]
conversion = [
    "torch",
    "transformers",
    "safetensors",
    "gguf",
    "huggingface-hub",
]
label-studio = [
    "label-studio==1.23.2",
    "sentry-sdk==2.77.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["health_refund_assistant*", "anotacao_documentos*", "toolbox*", "treinamento_visual*"]
